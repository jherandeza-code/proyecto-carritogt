spring.application.name=carritogt
server.port=8080

# Conexion a MySQL (base del script ingeniero PRO)
spring.datasource.url=jdbc:mysql://localhost:3306/cc
spring.datasource.username=${DB_USER:carrito}
spring.datasource.password=${DB_PASSWORD:Carrito_2026}

# No toque el esquema: se usan las 2 tablas tal como vienen del script
spring.jpa.hibernate.ddl-auto=none
# Use los nombres de columnas tal cual (idProducto, codUsuario...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Mostrar en consola el SQL que genera JPA (sirve para la defensa)
spring.jpa.show-sql=true

